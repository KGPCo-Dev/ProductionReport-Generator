{% extends 'base.html' %}
{% load static %}
{% block title %} Inicio - KGPCo{% endblock %}

{%block extra_css%}
    <link rel="stylesheet" href="{% static 'css/live_dashboards.css' %}">
{% endblock %}

{% block content %}

    <div class="col-md-4 py-2">
        <form id="table-type-form" method="GET">
            <label for="table_type" class="form-label fw-bold">Tipo de Tabla</label>
            <select name="table_type" id="table_type" class="form-select" onchange="document.getElementById('table-type-form').submit();">
                <option value="machines_status_table" {% if table_type == 'machines_status_table' %}selected{% endif %}>Maquinas de Corte</option>
                <option value="subassembly_status_table" {% if table_type == 'subassembly_status_table' %}selected{% endif %}>Ordenes Subensamble</option>
            </select>
        </form>
    </div>

    <div class="d-flex align-items-center mb-3">
        <div class="accent-line me-3"></div>
        <h1 class="h3 mb-0 fw-bold" id="dashboard-title">Manufactory Flow Control</h1>
    </div>

    <div class="js-table-container" id="dashboard-table-container">
        {% include partial_template with results=results %}
    </div>
{% endblock %}

{% block extra_js %}

<script src="{% static 'js/ajax_machine_results.js' %}"></script>

{% endblock %}
